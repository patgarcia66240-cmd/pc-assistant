[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "pc-assistant"
version = "0.1.0"
description = "ARIA - AI-powered PC Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-dotenv>=1.0,<2",
    "anthropic>=0.42,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "aiosqlite>=0.19,<1",
    "psutil>=5.9,<8",
    "aiofiles>=23.2,<26",
    "python-multipart>=0.0.6,<1",
    "kokoro-onnx[gpu]>=0.6.1,<0.7",
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<2; sys_platform == 'win32'",
    "piper-tts>=1.8,<2",
    "soundfile>=0.13,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]
