[package]
name = "pc-assistant"
version = "0.1.0"
description = "ARIA - AI-powered PC Assistant"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
