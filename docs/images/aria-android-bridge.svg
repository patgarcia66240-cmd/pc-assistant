<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Passerelle Android d'ARIA</title>
  <desc id="desc">Schéma du plugin android_bridge et de l'app compagnon Android : connexion WebSocket locale appairée par jeton, capacités exposées et liaison avec l'interface ARIA.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1500" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#22D3EE"/>
    </marker>
    <style>
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #94A3B8; }
      .section { font: 700 15px "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; fill: #7DD3FC; }
      .box-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #F8FAFC; }
      .box-text { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #CBD5E1; }
      .small { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #94A3B8; }
      .chip { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #E0F2FE; }
      .flow { fill: none; stroke: #60A5FA; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .flow-bi { fill: none; stroke: #22D3EE; stroke-width: 2.4; marker-start: url(#arrowCyan); marker-end: url(#arrowCyan); }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #67E8F9; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1500" height="950" fill="url(#page)"/>
  <circle cx="1360" cy="90" r="220" fill="#0EA5E9" opacity=".06"/>
  <circle cx="110" cy="880" r="240" fill="#22C55E" opacity=".05"/>

  <g transform="translate(60 40)">
    <rect width="64" height="64" rx="16" fill="url(#brand)" filter="url(#shadow)"/>
    <path d="M15 34c5-13 13-19 17-19s12 6 17 19c-5 13-13 19-17 19S20 47 15 34Z" fill="#0F2B5C" opacity=".45"/>
    <circle cx="32" cy="34" r="10" fill="#A5F3FC"/>
    <circle cx="32" cy="34" r="5" fill="#0B3A78"/>
    <circle cx="35" cy="31" r="2" fill="#FFFFFF"/>
  </g>
  <text x="145" y="68" class="title">Passerelle Android — ARIA</text>
  <text x="145" y="94" class="subtitle">Contacts et infos du téléphone, lus à la demande via une connexion Wi-Fi locale appairée par jeton</text>

  <text x="60" y="150" class="section">TÉLÉPHONE ANDROID</text>
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="620" height="300" rx="22" fill="#101B30" stroke="#22C55E" stroke-width="2"/>
    <rect x="84" y="196" width="46" height="46" rx="12" fill="#16A34A"/>
    <rect x="98" y="205" width="18" height="28" rx="3" fill="none" stroke="#FFF" stroke-width="2"/>
    <text x="146" y="216" class="box-title">ARIA Phone Bridge (Kotlin)</text>
    <text x="146" y="240" class="box-text">App compagnon Android</text>
    <text x="84" y="272" class="small">Service de premier plan · reste actif en arrière-plan · notification persistante</text>

    <rect x="84" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="104" y="320" class="box-title" style="font-size:16px">WebSocket</text>
    <text x="104" y="344" class="box-text">Ktor · moteur CIO</text>
    <text x="104" y="366" class="box-text">0.0.0.0:8765</text>
    <text x="104" y="394" class="small">Route /ws</text>
    <text x="104" y="414" class="small">Ping toutes les 20 s</text>

    <rect x="280" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="300" y="320" class="box-title" style="font-size:16px">Capacités</text>
    <text x="300" y="344" class="box-text">Contacts ✓</text>
    <text x="300" y="366" class="box-text">Infos appareil ✓</text>
    <text x="300" y="394" class="small">SMS · notifs · GPS</text>
    <text x="300" y="414" class="small">à ajouter (même modèle)</text>

    <rect x="476" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="496" y="320" class="box-title" style="font-size:16px">Appairage</text>
    <text x="496" y="344" class="box-text">Jeton régénérable</text>
    <text x="496" y="366" class="box-text">Chiffré localement</text>
    <text x="496" y="394" class="small">Stockage chiffré</text>
    <text x="496" y="414" class="small">Vérif. temps constant</text>
  </g>

  <path d="M680 320H820" class="flow-bi"/>
  <text x="750" y="300" class="label">WebSocket</text>
  <text x="750" y="345" class="label">Wi-Fi local</text>

  <text x="820" y="150" class="section">ARIA — PLUGIN ANDROID_BRIDGE</text>
  <g filter="url(#shadow)">
    <rect x="820" y="170" width="620" height="300" rx="22" fill="#101B30" stroke="#2563EB" stroke-width="2"/>
    <rect x="844" y="196" width="46" height="46" rx="12" fill="url(#brand)"/>
    <path d="M857 210h20v14h-11l-6 5v-5h-3Z" fill="none" stroke="#FFF" stroke-width="2"/>
    <text x="906" y="216" class="box-title">Plugin android_bridge</text>
    <text x="906" y="240" class="box-text">backend/plugins/android_bridge/</text>
    <text x="844" y="272" class="small">Découvert et monté automatiquement par plugin_loader.py</text>

    <rect x="844" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="864" y="320" class="box-title" style="font-size:16px">client.py</text>
    <text x="864" y="344" class="box-text">Connexion WebSocket</text>
    <text x="864" y="366" class="box-text">Corrélation par id</text>
    <text x="864" y="394" class="small">Erreurs en français</text>

    <rect x="1040" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="1060" y="320" class="box-title" style="font-size:16px">router.py</text>
    <text x="1060" y="344" class="box-text">/pair · /status</text>
    <text x="1060" y="366" class="box-text">/contacts</text>
    <text x="1060" y="394" class="small">/device-info · /forget</text>
    <text x="1060" y="414" class="small">Préfixe /api/android</text>

    <rect x="1236" y="292" width="180" height="150" rx="14" fill="#17233B" stroke="#334155"/>
    <text x="1256" y="320" class="box-title" style="font-size:16px">Persistance</text>
    <text x="1256" y="344" class="box-text">Appairage persistant</text>
    <text x="1256" y="366" class="box-text">Reconnexion auto</text>
    <text x="1256" y="394" class="small">store.py + lifecycle.py</text>
    <text x="1256" y="414" class="small">android_bridge.json</text>
  </g>

  <path d="M1130 470V560" class="flow"/>

  <text x="820" y="592" class="section">ARIA — INTERFACE</text>
  <g filter="url(#shadow)">
    <rect x="820" y="612" width="620" height="150" rx="20" fill="#121C2D" stroke="#334155"/>
    <rect x="844" y="636" width="46" height="46" rx="12" fill="#2563EB"/>
    <rect x="856" y="645" width="22" height="28" rx="3" fill="none" stroke="#FFF" stroke-width="2"/>
    <text x="906" y="656" class="box-title">Onglet Téléphone</text>
    <text x="906" y="680" class="box-text">AndroidBridge.jsx (React)</text>
    <text x="844" y="712" class="box-text">Formulaire d'appairage · statut de connexion · liste de contacts avec recherche</text>
    <text x="844" y="736" class="small">Interroge GET/POST /api/android/* — jamais directement le téléphone</text>
  </g>

  <text x="60" y="592" class="section">SÉCURITÉ</text>
  <g filter="url(#shadow)">
    <rect x="60" y="612" width="620" height="150" rx="20" fill="#121C2D" stroke="#334155"/>
    <text x="84" y="644" class="box-text">• Aucune route exposée sur Internet : réseau Wi-Fi local uniquement.</text>
    <text x="84" y="670" class="box-text">• Le jeton d'appairage est l'unique protection ; le régénérer déconnecte le PC.</text>
    <text x="84" y="696" class="box-text">• Chaque capacité (contacts...) exige sa propre permission Android, accordée à la volée.</text>
    <text x="84" y="722" class="box-text">• Aucune donnée n'est poussée automatiquement : lecture à la demande d'ARIA uniquement.</text>
  </g>

  <text x="60" y="870" class="small">Étendre : un nouveau fichier PhoneCapability côté Android + une route côté router.py — voir android/README.md.</text>
</svg>
